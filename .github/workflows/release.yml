name: Prepare signed Sukun release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed release tag (for example v0.24.11)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Validate tag and signing requirements
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          KEYSTORE_DATA: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "versionName = \"${RELEASE_TAG#v}\"" app/build.gradle.kts
          [[ -n "$KEYSTORE_DATA" && -n "$KEY_ALIAS" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]
          umask 077
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/sukun-signing.p12"
      - name: Check and build signed APK
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash gradlew --max-workers=4 :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest :app:lintFullDebug :app:lintFdroidDebug :app:assembleFullRelease :app:assembleFdroidRelease \
            -Pkhushu.singleApk=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sukun-signing.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/full/release/app-full-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sukun-signing.p12"
      - name: Prepare draft release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/full/release/app-full-release.apk "sukun-full-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "sukun-fdroid-$RELEASE_TAG.apk"
          sha256sum "sukun-full-$RELEASE_TAG.apk" "sukun-fdroid-$RELEASE_TAG.apk" > "sukun-$RELEASE_TAG.sha256"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Sukun $RELEASE_TAG" --generate-notes \
            "sukun-full-$RELEASE_TAG.apk" "sukun-fdroid-$RELEASE_TAG.apk" "sukun-$RELEASE_TAG.sha256"
