name: Sukun checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Install pinned Android targets
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, build, and lint both distributions
        env:
          TEST_RUN_NUMBER: ${{ github.run_number }}
        run: |
          export SUKUN_TEST_VERSION_CODE=$((100000 + TEST_RUN_NUMBER))
          bash gradlew --max-workers=4 :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest :app:assembleFullDebug :app:assembleFdroidDebug :app:lintFullDebug :app:lintFdroidDebug
      - name: Check retained phone-test signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: test-signing
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.SUKUN_TEST_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$TEST_KEYSTORE_BASE64" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Phone download withheld: configure SUKUN_TEST_KEYSTORE_BASE64 once using scripts/setup-test-signing.sh. Temporary runner keys cannot produce repeatable updates.'
          fi
      - name: Prepare phone-test download
        if: steps.test-signing.outputs.available == 'true'
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.SUKUN_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_file="$RUNNER_TEMP/sukun-test-signing.p12"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          test_apk=app/build/outputs/apk/fdroid/debug/app-fdroid-universal-debug.apk
          mkdir -p "$RUNNER_TEMP/sukun-phone-test"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$signing_file" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/sukun-phone-test/sukun-fdroid-debug.apk" "$test_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/sukun-phone-test/sukun-fdroid-debug.apk" > "$RUNNER_TEMP/sukun-phone-test/signer-certificate.txt"
          cp LICENSE "$RUNNER_TEMP/sukun-phone-test/LICENSE"
          cp docs/PHONE_TESTING.md "$RUNNER_TEMP/sukun-phone-test/PHONE_TESTING.md"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/sukun-phone-test/source-commit.txt"
          cd "$RUNNER_TEMP/sukun-phone-test"
          sha256sum sukun-fdroid-debug.apk > SHA256SUMS
      - name: Upload phone-test APK
        if: steps.test-signing.outputs.available == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sukun-phone-test
          path: ${{ runner.temp }}/sukun-phone-test/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain test and lint evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: reports
          path: app/build/reports/
  android-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            image: system-images;android-30;default;x86_64
          - api: 35
            image: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Install emulator and SDK
        env:
          ANDROID_TEST_IMAGE: ${{ matrix.image }}
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' "$ANDROID_TEST_IMAGE"
      - name: Run Android checks
        env:
          ANDROID_TEST_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/sukun-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n sukun-api30 -k "$ANDROID_TEST_IMAGE" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx sukun-api30
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd sukun-api30 -no-window -no-audio -no-snapshot -no-metrics -gpu swiftshader -accel on -memory 2048 -cores 2 -no-boot-anim -skin 480x800 > emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] &&
               [[ "$(adb shell service check package 2>/dev/null | tr -d '\r')" == 'Service package: found' ]] &&
               [[ "$(adb shell service check activity 2>/dev/null | tr -d '\r')" == 'Service activity: found' ]]; then break; fi
            sleep 5
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          [[ "$(adb shell service check package | tr -d '\r')" == 'Service package: found' ]]
          [[ "$(adb shell service check activity | tr -d '\r')" == 'Service activity: found' ]]
          # The low-resolution skin retains Pixel 2's 420 dpi unless overridden.
          # Use a 480 x 1040 dp portrait viewport matching the reported compact display layout.
          adb shell wm size
          adb shell wm density
          adb shell wm size 480x1040
          adb shell wm density 160
          adb shell wm size
          adb shell wm density
          adb shell wm density | grep -F 'Override density: 160'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          bash gradlew -Dddmlib.getprop.timeout.sec=30 --max-workers=4 :app:connectedFdroidDebugAndroidTest
      - name: Verify an update preserves installed app data
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/sukun-android
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/sukun-android
          ANDROID_AVD_HOME: ${{ runner.temp }}/sukun-android/avd
        run: |
          set -euo pipefail
          update_log="$RUNNER_TEMP/sukun-update-check.log"
          exec > >(tee "$update_log") 2>&1
          trap 'message=$(tail -35 "$update_log"); message=${message//%/%25}; message=${message//$'"'"'\n'"'"'/%0A}; echo "::error title=APK update check::$message"' ERR
          app_id=io.github.raiquiaseishun.sukun.debug
          # UTP may remove its installations. Establish our own baseline and saved settings.
          adb install -r app/build/outputs/apk/fdroid/debug/app-fdroid-universal-debug.apk
          adb install -r app/build/outputs/apk/androidTest/fdroid/debug/app-fdroid-debug-androidTest.apk
          adb shell am instrument -w -e class com.kaizen.khushu.AppIconInstrumentedTest \
            "$app_id.test/androidx.test.runner.AndroidJUnitRunner" | tee "$RUNNER_TEMP/update-seed-tests.txt"
          grep -F 'OK (2 tests)' "$RUNNER_TEMP/update-seed-tests.txt"
          adb shell am force-stop "$app_id"
          adb shell run-as "$app_id" sh -c '"echo sukun-update-preserved > files/update-check.txt"'
          adb exec-out run-as "$app_id" cat files/datastore/settings.preferences_pb > "$RUNNER_TEMP/settings-before.pb"
          test -s "$RUNNER_TEMP/settings-before.pb"
          baseline_code=$(adb shell dumpsys package "$app_id" | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | tr -d '\r')
          [[ "$baseline_code" =~ ^[0-9]+$ ]]
          export SUKUN_TEST_VERSION_CODE=$((baseline_code + 1))
          bash gradlew --max-workers=4 :app:assembleFdroidDebug
          adb install -r app/build/outputs/apk/fdroid/debug/app-fdroid-universal-debug.apk
          adb exec-out run-as "$app_id" cat files/datastore/settings.preferences_pb > "$RUNNER_TEMP/settings-after.pb"
          cmp "$RUNNER_TEMP/settings-before.pb" "$RUNNER_TEMP/settings-after.pb"
          [[ "$(adb shell run-as "$app_id" cat files/update-check.txt | tr -d '\r')" == sukun-update-preserved ]]
          adb shell dumpsys package "$app_id" | grep -F "versionCode=$SUKUN_TEST_VERSION_CODE "
          echo 'APK update preserved the actual settings DataStore and private-file marker.'
      - name: Surface Android failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, xml.etree.ElementTree as ET
          def annotation(title, lines):
              message = '\n'.join(lines)[:3500]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + title + '::' + message)
          reports = list(pathlib.Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
                  for failure in root.iter('failure'):
                      annotation('Android test failure', [str(report), failure.get('message', ''), failure.text or ''])
              except ET.ParseError:
                  pass
          annotation('Android test reports', [str(p) for p in reports] or ['No test-result XML files: application tests may not have started.'])
          for command in [
              ['adb', 'devices', '-l'],
              ['adb', 'shell', 'wm', 'size'],
              ['adb', 'shell', 'wm', 'density'],
              ['adb', 'shell', 'getprop', 'sys.boot_completed'],
              ['adb', 'shell', 'service', 'check', 'package'],
              ['adb', 'shell', 'service', 'check', 'activity'],
              ['free', '-m'], ['df', '-h', '.'],
          ]:
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=15)
                  annotation('Android runner status', [' '.join(command), result.stdout, result.stderr])
              except subprocess.TimeoutExpired:
                  annotation('Android runner status', ['Timed out: ' + ' '.join(command)])
          log = pathlib.Path('emulator.log')
          if log.exists():
              lines = [line for line in log.read_text(errors='replace').splitlines()
                       if 'pubkey' not in line and 'public key' not in line]
              annotation('Emulator log tail', lines[-25:])
          PYTHON
      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
