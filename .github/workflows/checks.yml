name: Sukun checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android targets
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, build, and lint both distributions
        run: bash gradlew --max-workers=4 :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest :app:assembleFullDebug :app:assembleFdroidDebug :app:lintFullDebug :app:lintFdroidDebug
      - name: Retain test and lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: app/build/reports/
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install emulator and SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Run Android checks
        shell: bash
        run: |
          set -euo pipefail
          printf 'no\n' | avdmanager create avd -n sukun-api30 -k 'system-images;android-30;default;x86_64' --device pixel_2
          sudo chmod a+rw /dev/kvm
          emulator -avd sukun-api30 -no-window -no-audio -no-snapshot -no-metrics -gpu swiftshader -accel on -no-boot-anim -skin 480x800 -dpi-device 160 > emulator.log 2>&1 &
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] &&
               [[ "$(adb shell service check package 2>/dev/null | tr -d '\r')" == 'Service package: found' ]] &&
               [[ "$(adb shell service check activity 2>/dev/null | tr -d '\r')" == 'Service activity: found' ]]; then break; fi
            sleep 5
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          [[ "$(adb shell service check package | tr -d '\r')" == 'Service package: found' ]]
          [[ "$(adb shell service check activity | tr -d '\r')" == 'Service activity: found' ]]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          bash gradlew -Dddmlib.getprop.timeout.sec=30 --max-workers=4 :app:connectedFdroidDebugAndroidTest
      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
